<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modular Box-Shadow Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <!-- Panel Kontrol Kiri -->
    <section class="card controls-card">
      <h1>Box-Shadow Generator</h1>

      <div class="control-group">
        <label for="x-offset">Horizontal Offset (X) <span id="x-val">10px</span></label>
        <input type="range" id="x-offset" min="-100" max="100" value="10">
      </div>

      <div class="control-group">
        <label for="y-offset">Vertical Offset (Y) <span id="y-val">10px</span></label>
        <input type="range" id="y-offset" min="-100" max="100" value="10">
      </div>

      <div class="control-group">
        <label for="blur">Blur Radius <span id="blur-val">20px</span></label>
        <input type="range" id="blur" min="0" max="100" value="20">
      </div>

      <div class="control-group">
        <label for="spread">Spread Radius <span id="spread-val">0px</span></label>
        <input type="range" id="spread" min="-50" max="50" value="0">
      </div>

      <div class="control-group">
        <label for="opacity">Opacity <span id="opacity-val">0.25</span></label>
        <input type="range" id="opacity" min="0" max="1" step="0.01" value="0.25">
      </div>

      <div class="control-row">
        <div class="control-group">
          <label for="color">Warna Bayangan</label>
          <input type="color" id="color" value="#000000">
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="inset">
          Inset (Bayangan Dalam)
        </label>
      </div>
    </section>

    <!-- Panel Pratinjau & Output Kanan -->
    <section class="preview-column">
      <div class="card preview-stage">
        <div id="preview-box">Preview Box</div>
      </div>

      <div class="card output-bar">
        <code id="css-output">box-shadow: 10px 10px 20px 0px rgba(0, 0, 0, 0.25);</code>
        <button id="copy-btn" type="button">Salin CSS</button>
      </div>
    </section>
  </main>

  <!-- Memuat pintu masuk modul JavaScript -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
